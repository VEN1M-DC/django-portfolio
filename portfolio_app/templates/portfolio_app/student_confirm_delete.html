{% extends 'portfolio_app/base.html' %}
{% block title %}Delete {{ object.name }}{% endblock %}
{% block content %}
<h1>Delete {{ object.name }}?</h1>
<p>This deletes the student and their associated portfolio and projects. This cannot be undone.</p>
<form method="post">{% csrf_token %}
<div class="actions"><button type="submit" class="danger">Confirm delete</button><a href="{% url 'student-detail' object.pk %}">Cancel</a></div>
</form>
{% endblock %}
